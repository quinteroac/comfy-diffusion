[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-diffusion"
version = "2.2.0"
description = "ComfyUI inference engine as a standalone Python library (no server, no UI)."
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Alejandro Quintero" },
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
urls = { Homepage = "https://github.com/quinteroac/comfy-diffusion", Repository = "https://github.com/quinteroac/comfy-diffusion", Issues = "https://github.com/quinteroac/comfy-diffusion/issues" }
dependencies = [
    "einops>=0.8.2",
    "huggingface_hub>=0.20",
    "numpy>=1.25.0",
    "pillow>=12.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "safetensors>=0.4.2",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "simpleeval>=1.0.0",
    "tokenizers>=0.13.3",
    "tqdm>=4.67.3",
    "transformers>=4.50.3",
    "typer>=0.24.1",
    "yarl>=1.18.0",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
cuda = [
    "torch",
    "torchvision",
]
audio = [
    "torchaudio",
]
video = [
    "av>=14.2.0",
    "imageio>=2.37.2",
    "opencv-python>=4.13.0.92",
]
comfyui = [
    "aiohttp>=3.11.8",
    "blake3",
    "comfy-aimdo>=0.2.12",
    "comfy-kitchen>=0.2.8",
    "comfyui-embedded-docs==0.4.3",
    "comfyui-workflow-templates==0.9.26",
    "glfw>=2.10.0",
    "httpx[http2]>=0.28.1",
    "kornia>=0.7.1",
    "psutil>=7.2.2",
    "pydantic~=2.0",
    "pyopengl>=3.1.10",
    "spandrel>=0.4.2",
    "torchsde>=0.2.6",
]
all = [
    "torch",
    "torchvision",
    "torchaudio",
    "av>=14.2.0",
    "imageio>=2.37.2",
    "opencv-python>=4.13.0.92",
    "aiohttp>=3.11.8",
    "blake3",
    "comfy-aimdo>=0.2.12",
    "comfy-kitchen>=0.2.8",
    "comfyui-embedded-docs==0.4.3",
    "comfyui-workflow-templates==0.9.26",
    "glfw>=2.10.0",
    "httpx[http2]>=0.28.1",
    "kornia>=0.7.1",
    "psutil>=7.2.2",
    "pydantic~=2.0",
    "pyopengl>=3.1.10",
    "spandrel>=0.4.2",
    "torchsde>=0.2.6",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
comfy-diffusion = "comfy_diffusion.cli.main:app"

[tool.setuptools.packages.find]
include = ["comfy_diffusion*"]

[tool.setuptools.package-data]
comfy_diffusion = [
    "py.typed",
    "skills/**/*.md",
]

[tool.uv]
# This project uses uv for install, lock, and run. See README and AGENTS.md.

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cuda", marker = "extra != 'cpu' and extra == 'cuda'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cuda", marker = "extra != 'cpu' and extra == 'cuda'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "extra == 'cpu'" },
  { index = "pytorch-cuda", marker = "extra != 'cpu' and extra == 'cuda'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
